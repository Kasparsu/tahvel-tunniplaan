<!doctype html>
<html lang="et">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tunniplaan · Techno TLN Kesklinn</title>
  <meta name="theme-color" content="#3e1b86" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <script>
    // Apply the theme before the app loads so the page does not flash another one.
    // No saved choice means automatic: Techno, or Techno dark when the device prefers dark (as in ThemeSelect.vue).
    try {
      const t = localStorage.getItem('tahvel.theme');
      document.documentElement.dataset.theme = t || (matchMedia('(prefers-color-scheme: dark)').matches ? 'techno-dark' : 'techno');
    } catch {}
  </script>
</head>
<body>
  <div id="app"></div>
  
  <script type="module" src="/src/main.js"></script>


</body>
</html>
